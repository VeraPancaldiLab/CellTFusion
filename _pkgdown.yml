url: https://verapancaldilab.github.io/CellTFusion/
template:
  bootstrap: 5
  bslib:
    primary: "#1B2A4A"

home:
  title: CellTFusion
  description: Integration of immune cell type deconvolution and TF networks to characterize TME cell states from bulk RNA-seq

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: "Feature computation"
        href: articles/a1_feature_computation.html
      - text: "Cell groups and latent factors"
        href: articles/a2_cell_groups.html
      - text: "TME state characterization"
        href: articles/a3_tme_states.html
      - text: "Statistical analysis"
        href: articles/a4_statistical_analysis.html
      - text: "Machine learning workflows"
        href: articles/a5_machine_learning.html
      - text: "Multi-cohort analysis"
        href: articles/a6_batch_analysis.html

